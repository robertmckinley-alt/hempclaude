<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ad.css">
<style>
:root{--bg:#2b2f2a;--ink:#e8e2c8;--hi:#ffd23f;--strike:#ff4a3d;--tape:#f3e59a;--alert:#ff4a3d}
.ad{background:var(--bg)}
.ad::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,transparent 2px 5px),
             radial-gradient(ellipse 80% 60% at 50% 30%,rgba(120,130,100,.35),transparent 70%);mix-blend-mode:multiply}
.h1{position:absolute;left:60px;right:60px;top:56px;font:400 {{H1SIZE}}px/1 Anton;color:var(--ink);letter-spacing:.01em;text-transform:uppercase}
.h1 s{text-decoration:line-through;text-decoration-color:var(--strike);text-decoration-thickness:10px;color:#9a9787}
.h1 b{color:var(--hi);font-weight:400}
.shelf{position:absolute;left:40px;right:40px;height:22px;background:linear-gradient(180deg,#8b7355,#5a4a36);box-shadow:0 14px 26px rgba(0,0,0,.5)}
.row{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:flex-end}
.row img{height:200px;filter:drop-shadow(0 12px 14px rgba(0,0,0,.6))}
.row.tall img{height:230px}
.tape{position:absolute;padding:8px 22px;background:var(--tape);color:#1b1b1b;font:700 22px/1 Courier;letter-spacing:.08em;text-transform:uppercase;
  transform:rotate(-2deg);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.tape.alert{background:var(--alert);color:#fff;transform:rotate(2deg)}
.cta{left:50%;transform:translateX(-50%);bottom:96px}
.legal{bottom:0}
{{CSS}}
</style></head><body><div class="ad">
<div class="h1">{{H1}}</div>
<div class="row {{ROWCLASS}}" style="bottom:540px">{{ROW1}}</div>
<div class="shelf" style="bottom:522px"></div>
<div class="tape" style="left:70px;bottom:500px">{{TAPE1}}</div>
<div class="row {{ROWCLASS}}" style="bottom:300px">{{ROW2}}</div>
<div class="shelf" style="bottom:282px"></div>
<div class="tape" style="left:70px;bottom:260px">{{TAPE2}}</div>
<div class="tape alert" style="right:70px;bottom:260px">{{TAPE3}}</div>
<a class="cta cta--gold">{{CTA}} <span>{{CTA2}}</span></a>
<div class="legal legal--dark"><span class="age">21+</span><span>Hemp-derived THC · purekana.com</span></div>
</div></body></html>
