<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ad.css">
<style>
:root{--bg:#f2e6d3;--glow:rgba(184,92,40,.22);--ink:#3b2214;--mut:#7a5a45;--c1:#b85c28;--c2:#b3261e}
.ad{background:var(--bg)}
.ad::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 100%,var(--glow),transparent 70%)}
.h1{position:absolute;left:60px;right:60px;top:62px;font:900 {{H1SIZE}}px/1.06 Inter;letter-spacing:-.035em;color:var(--ink);text-align:center}
.cals{position:absolute;left:60px;right:60px;top:250px;display:flex;gap:30px}
.cal{flex:1;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 18px 40px rgba(59,34,20,.18);text-align:center;position:relative;min-height:360px}
.cal .m{padding:16px;font:700 22px/1 Inter;letter-spacing:.2em;text-transform:uppercase;color:#fff}
.cal .d{font:900 150px/1 Inter;letter-spacing:-.06em;color:var(--ink);padding:12px 0 0}
.cal .w{font:700 24px/1.3 Inter;color:var(--mut);padding:6px 20px 24px}
.cal.a .m{background:var(--c1)}
.cal.b .m{background:var(--c2)}
.cal.b .d{color:var(--c2)}
.cal .pic{height:250px;margin:16px auto 0;filter:drop-shadow(0 14px 18px rgba(0,0,0,.25))}
.plan{position:absolute;left:0;right:290px;top:640px;text-align:center;font:400 66px/1.1 Bebas;letter-spacing:.06em;color:var(--ink)}
.bag{position:absolute;right:10px;bottom:40px;width:270px;transform:rotate(8deg);filter:drop-shadow(0 22px 26px rgba(59,34,20,.35))}
.cta{left:60px;bottom:100px}
.legal{bottom:0;right:340px}
{{CSS}}
</style></head><body><div class="ad">
<div class="h1">{{H1}}</div>
<div class="cals">
  <div class="cal a">{{C1}}</div>
  <div class="cal b">{{C2}}</div>
</div>
<div class="plan">{{PLAN}}</div>
<img class="bag" src="{{IMG}}">
<a class="cta cta--ink">{{CTA}} <span>{{CTA2}}</span></a>
<div class="legal legal--light"><span class="age">21+</span><span>Hemp-derived THC · purekana.com</span></div>
</div></body></html>
