<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ad.css">
<style>
:root{--bg:#f6f3ec;--glow:rgba(255,120,90,.18);--ink:#10151c;--em:#d6281f;--mut:#7a7368}
.ad{background:var(--bg)}
.ad::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 28% 52%,var(--glow),transparent 70%)}
.h1{position:absolute;left:60px;right:60px;top:56px;font:900 {{H1SIZE}}px/1.08 Inter;letter-spacing:-.035em;color:var(--ink)}
.h1 em{font-style:normal;color:var(--em)}
.panel{position:absolute;top:300px;bottom:225px;border-radius:24px;background:#fff;box-shadow:0 20px 50px rgba(16,21,28,.10);border:1px solid #e6e1d6;overflow:hidden}
.panel.l{left:60px;width:560px}
.panel.r{left:650px;right:60px}
.lbl{position:absolute;top:26px;left:0;right:0;text-align:center;font:700 19px/1 Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.big{position:absolute;bottom:34px;left:0;right:0;text-align:center;font:900 82px/1 Inter;letter-spacing:-.05em;color:var(--ink)}
.big small{display:block;font:700 22px/1.4 Inter;letter-spacing:.02em;color:var(--mut);margin-top:8px}
.big.em{color:var(--em)}
.pimg{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%) rotate(-12deg);width:330px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.25))}
.pimg.bag{width:200px;transform:translate(-50%,-66%) rotate(-5deg)}
.dot{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#c43a2e;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff,0 0 0 4px #c43a2e}
.glass{position:absolute;left:50%;top:48%;width:170px;height:170px;border:6px solid var(--ink);border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,.4))}
.glass::after{content:"";position:absolute;width:26px;height:120px;background:var(--ink);border-radius:14px;right:-58px;bottom:-96px;transform:rotate(-45deg)}
.huge{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;font:400 220px/1 Bebas;color:var(--ink)}
.huge.em{color:var(--em)}
.cta{left:50%;transform:translateX(-50%);bottom:100px}
.legal{bottom:0}
{{CSS}}
</style></head><body><div class="ad">
<div class="h1">{{H1}}</div>
<div class="panel l">{{P1}}</div>
<div class="panel r">{{P2}}</div>
<a class="cta cta--red">{{CTA}} <span>{{CTA2}}</span></a>
<div class="legal legal--light"><span class="age">21+</span><span>{{LEGAL}}</span></div>
</div></body></html>
