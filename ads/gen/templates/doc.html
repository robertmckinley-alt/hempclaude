<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ad.css">
<style>
:root{--bg:#0b1410;--glow:rgba(38,84,58,.55);--lbl:#c9f27a;--stamp:#ff4a4a;--subt:#ffe75c}
.ad{background:var(--bg)}
.ad::before{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 90% 60% at 50% 40%,var(--glow),transparent 65%),
             linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.85) 100%)}
.bar{position:absolute;left:0;right:0;height:64px;background:#000}
.bar.t{top:0}.bar.b{bottom:0}
.rec{position:absolute;top:84px;left:40px;display:flex;align-items:center;gap:12px;font:700 20px/1 Courier;letter-spacing:.12em;color:#ff4a4a}
.rec::before{content:"";width:16px;height:16px;border-radius:50%;background:#ff4a4a;box-shadow:0 0 12px #ff4a4a}
.tag{position:absolute;top:84px;right:40px;font:700 20px/1 Courier;letter-spacing:.12em;color:rgba(255,255,255,.7)}
.label{position:absolute;left:60px;top:150px;font:700 22px/1 Courier;letter-spacing:.22em;color:var(--lbl);text-transform:uppercase}
.species{position:absolute;left:60px;top:186px;font:900 italic 70px/1.02 Playfair;color:#fff;letter-spacing:-.01em;max-width:620px}
.status{position:absolute;left:60px;top:378px;display:inline-flex;align-items:center;gap:14px;padding:12px 20px;border:3px solid var(--stamp);border-radius:8px;
  font:900 26px/1 Inter;letter-spacing:.14em;color:var(--stamp);text-transform:uppercase;transform:rotate(-3deg);background:rgba(0,0,0,.35)}
.bags{position:absolute;right:-50px;top:380px;width:560px;filter:drop-shadow(0 40px 50px rgba(0,0,0,.75))}
.bags.tall{right:60px;top:290px;width:280px}
.subt{position:absolute;left:0;right:0;bottom:200px;text-align:center;font:700 34px/1.3 Inter;color:var(--subt);
  text-shadow:0 2px 4px #000,0 0 12px rgba(0,0,0,.9);padding:0 60px}
.subt i{font-style:normal;color:#fff}
.cta{left:50%;transform:translateX(-50%);bottom:96px}
.legal{bottom:64px;padding-bottom:8px}
{{CSS}}
</style></head><body><div class="ad">
<div class="bar t"></div><div class="bar b"></div>
<div class="rec">REC</div>
<div class="tag">{{TAG}}</div>
<div class="label">{{LABEL}}</div>
<div class="species">{{H1}}</div>
<div class="status">{{STAMP}}</div>
<img class="bags {{IMGCLASS}}" src="{{IMG}}">
<p class="subt">{{SUB}}</p>
<a class="cta cta--gold">{{CTA}} <span>{{CTA2}}</span></a>
<div class="legal legal--dark"><span class="age">21+</span><span>Hemp-derived THC · purekana.com</span></div>
</div></body></html>
