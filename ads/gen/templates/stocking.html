<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ad.css">
<style>
:root{--bg:#0f1a2e;--hi:#f0cf85;--sub:#e8dcc4;--sock1:#c22d24;--sock2:#8f1e17}
.ad{background:var(--bg)}
.ad::before{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(201,151,63,.28),transparent 60%),
             radial-gradient(circle at 12% 30%,rgba(255,255,255,.5) 0 2px,transparent 3px),
             radial-gradient(circle at 88% 22%,rgba(255,255,255,.4) 0 2px,transparent 3px),
             radial-gradient(circle at 70% 60%,rgba(255,255,255,.35) 0 1.5px,transparent 3px),
             radial-gradient(circle at 25% 75%,rgba(255,255,255,.3) 0 1.5px,transparent 3px)}
.mantel{position:absolute;left:0;right:0;top:0;height:60px;background:linear-gradient(180deg,#4a3320,#2d1e12);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.h1{position:absolute;left:60px;right:60px;top:96px;font:400 {{H1SIZE}}px/1 Bebas;letter-spacing:.02em;color:#fff;text-align:center}
.h1 b{color:var(--hi);font-weight:400}
.h2{position:absolute;left:60px;right:60px;top:262px;text-align:center;font:700 32px/1.3 Playfair;color:var(--sub)}
.stock{position:absolute;left:150px;top:430px;width:360px;height:470px;transform:rotate(-5deg);filter:drop-shadow(0 26px 30px rgba(0,0,0,.6))}
.stock .leg{position:absolute;left:0;top:30px;width:210px;height:330px;background:linear-gradient(90deg,var(--sock1),var(--sock2))}
.stock .foot{position:absolute;left:0;top:300px;width:360px;height:170px;background:linear-gradient(180deg,var(--sock1),var(--sock2));border-radius:0 85px 85px 60px}
.stock .heel{position:absolute;left:0;top:300px;width:210px;height:60px;background:var(--sock1)}
.stock .cuff{position:absolute;left:-14px;top:0;width:238px;height:82px;background:#fff;border-radius:18px;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.bag{position:absolute;left:170px;top:352px;width:250px;transform:rotate(-5deg);filter:drop-shadow(0 20px 26px rgba(0,0,0,.55))}
.bag.tall{left:210px;top:300px;width:170px}
.tag{position:absolute;right:120px;top:520px;padding:16px 24px;background:#f4ecd8;color:#2a1e08;font:700 24px/1.35 Elite;transform:rotate(8deg);box-shadow:0 8px 20px rgba(0,0,0,.5);border-radius:4px}
.tag::before{content:"";position:absolute;left:-14px;top:18px;width:20px;height:20px;border:3px solid #2a1e08;border-radius:50%;background:#f4ecd8}
.gummy{position:absolute;right:170px;top:660px;width:150px;transform:rotate(20deg);filter:drop-shadow(0 16px 20px rgba(0,0,0,.5))}
.cta{left:50%;transform:translateX(-50%);bottom:100px}
.legal{bottom:0}
{{CSS}}
</style></head><body><div class="ad">
<div class="mantel"></div>
<div class="h1">{{H1}}</div>
<div class="h2">{{SUB}}</div>
<div class="stock"><div class="leg"></div><div class="heel"></div><div class="foot"></div><div class="cuff"></div></div>
<img class="bag {{IMGCLASS}}" src="{{IMG}}">
<div class="tag">{{TAGTXT}}</div>
<img class="gummy" src="../img/gummy.png">
<a class="cta cta--gold">{{CTA}} <span>{{CTA2}}</span></a>
<div class="legal legal--dark"><span class="age">21+</span><span>Hemp-derived THC · purekana.com</span></div>
</div></body></html>
