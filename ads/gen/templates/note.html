<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ad.css">
<style>
:root{--bg:#1d2a3a;--paper:#f6efe0;--ink:#2a2420;--stamp:#c22d24}
.ad{background:var(--bg)}
.ad::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(255,255,255,.08),transparent 70%)}
.paper{position:absolute;left:70px;right:70px;top:70px;bottom:210px;background:var(--paper);border-radius:6px;transform:rotate(-1.2deg);
  box-shadow:0 30px 60px rgba(0,0,0,.5);padding:56px 60px;
  background-image:repeating-linear-gradient(0deg,transparent 0 46px,rgba(42,36,32,.08) 46px 47px);background-position:0 40px}
.pin{position:absolute;left:50%;top:-14px;width:28px;height:28px;border-radius:50%;background:#c9973f;transform:translateX(-50%);box-shadow:0 4px 8px rgba(0,0,0,.4)}
.date{font:400 22px/1 Elite;color:#7a6f63;letter-spacing:.04em}
.h1{margin-top:22px;font:400 {{H1SIZE}}px/1.22 Elite;color:var(--ink)}
.h1 b{font-weight:400;color:var(--stamp)}
.sig{margin-top:26px;font:400 26px/1.3 Elite;color:#7a6f63}
.stamp{position:absolute;right:50px;top:40px;padding:10px 18px;border:4px solid var(--stamp);color:var(--stamp);border-radius:6px;
  font:900 24px/1.2 Inter;letter-spacing:.16em;text-transform:uppercase;transform:rotate(12deg);opacity:.9}
.bag{position:absolute;right:40px;bottom:170px;width:{{IMGW}}px;transform:rotate(7deg);filter:drop-shadow(0 26px 30px rgba(0,0,0,.6))}
.cta{left:50%;transform:translateX(-50%);bottom:96px}
.legal{bottom:0}
{{CSS}}
</style></head><body><div class="ad">
<div class="paper"><div class="pin"></div>
  <div class="date">{{DATE}}</div>
  <div class="h1">{{H1}}</div>
  <div class="sig">{{SIG}}</div>
  <div class="stamp">{{STAMP}}</div>
</div>
<img class="bag" src="{{IMG}}">
<a class="cta cta--gold">{{CTA}} <span>{{CTA2}}</span></a>
<div class="legal legal--dark"><span class="age">21+</span><span>Hemp-derived THC · purekana.com</span></div>
</div></body></html>
