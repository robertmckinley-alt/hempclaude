<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ad.css">
<style>
:root{--bg:#141a2e;--glow:rgba(60,40,110,.6);--hi:#e8c67d;--sub:#b6bfda;--moon:#f4e7b8}
.ad{background:var(--bg)}
.ad::before{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 55% at 50% 110%,var(--glow),transparent 65%),
             radial-gradient(circle at 15% 18%,rgba(255,255,255,.55) 0 2px,transparent 3px),
             radial-gradient(circle at 82% 12%,rgba(255,255,255,.45) 0 2px,transparent 3px),
             radial-gradient(circle at 60% 28%,rgba(255,255,255,.35) 0 1.5px,transparent 3px),
             radial-gradient(circle at 30% 42%,rgba(255,255,255,.3) 0 1.5px,transparent 3px),
             radial-gradient(circle at 90% 45%,rgba(255,255,255,.3) 0 1.5px,transparent 3px)}
.moon{position:absolute;right:110px;top:90px;width:120px;height:120px;border-radius:50%;background:var(--moon);box-shadow:0 0 60px color-mix(in srgb,var(--moon) 50%,transparent)}
.moon::after{content:"";position:absolute;left:-30px;top:-14px;width:110px;height:110px;border-radius:50%;background:var(--bg)}
.moon.off{display:none}
/* copy block flows: sub always sits under the headline no matter how it wraps */
.copy{position:absolute;left:70px;top:110px;width:570px}
.h1{font:700 {{H1SIZE}}px/1.08 Playfair;color:#fff;letter-spacing:-.015em}
.h1 em{font-style:italic;font-weight:900;color:var(--hi)}
.h2{margin-top:26px;font:500 30px/1.45 Inter;color:var(--sub)}
.h2 b{color:#fff;font-weight:700}
.z{position:absolute;font:900 italic 90px/1 Playfair;color:color-mix(in srgb,var(--hi) 55%,transparent)}
.z.off{display:none}
.bag{position:absolute;right:-20px;bottom:40px;width:470px;transform:rotate(-6deg);filter:drop-shadow(0 40px 50px rgba(0,0,0,.7))}
.bag.tall{right:40px;bottom:30px;width:330px;transform:rotate(6deg)}
.bag.wide{right:-40px;bottom:190px;width:560px;transform:rotate(-4deg)}
.cta{left:70px;bottom:96px}
.legal{bottom:0;right:520px}
{{CSS}}
</style></head><body><div class="ad">
<div class="moon {{MOON}}"></div>
<div class="copy"><div class="h1">{{H1}}</div><p class="h2">{{SUB}}</p></div>
<div class="z {{Z}}" style="left:590px;top:560px">z</div>
<div class="z {{Z}}" style="left:640px;top:500px;font-size:70px">z</div>
<div class="z {{Z}}" style="left:680px;top:455px;font-size:50px">z</div>
<img class="bag {{IMGCLASS}}" src="{{IMG}}">
<a class="cta cta--gold">{{CTA}} <span>{{CTA2}}</span></a>
<div class="legal legal--dark"><span class="age">21+</span><span>Hemp-derived THC · purekana.com</span></div>
</div></body></html>
